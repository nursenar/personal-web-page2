  <link rel="stylesheet" href="style.css" />

  <style>
    .contact-section {
      max-width: 800px;
      margin: 40px auto;
      text-align: center;
    }
    .contact-section h2 {
      color: #1abc9c;
      margin-bottom: 8px;
    }
    .contact-section p {
      color: #6b7b8c;
      margin-bottom: 30px;
    }

    .contact-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 25px;
    }

    .contact-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
      width: 160px;
      height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .contact-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.15);

    }
    .contact-card:hover img {
  transform: rotate(10deg) scale(1.1);
  transition: 0.3s;
}


    .contact-card img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .contact-card span {
      font-weight: 600;
      color: #2c3e50;
      font-size: 1rem;
    }

    @media (max-width: 600px) {
      .contact-card {
        width: 130px;
        height: 130px;
      }
      .contact-card img {
        width: 48px;
        height: 48px;
      }
    }
  </style>
</head>
